[workspace]
members = [
    "programs/lending_oracle"
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

[workspace.metadata.solana]
tools-version = "1.52"

[profile.release]
overflow-checks = true
lto = "fat"
